# PhantomGate configuration override file
# Edit this file to customize PhantomGate service settings.
# After modifying, run: systemctl daemon-reload && systemctl restart phantomgate

[Service]
# Example: override environment variables
# Environment=PHANTOMGATE_LOG_LEVEL=debug

# Example: change ports (also update config.yml)
# ExecStart=/usr/bin/phantomgate --config /etc/phantomgate/config.yml --https-port 8443 --http-port 8080

# Example: enable DNS interception mode
# ExecStart=/usr/bin/phantomgate --config /etc/phantomgate/config.yml --intercept --gateway 192.168.1.1
